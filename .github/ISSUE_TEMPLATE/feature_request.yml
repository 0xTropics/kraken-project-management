name: Feature request
description: Suggest a change or an addition to Kraken.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Kraken is maintained by one person and is deliberately small. Please open an issue and talk it through before writing a large change.
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the situation, not the solution. What are you doing today, and where does it hurt?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
      description: How you imagine it working. Sketches and screenshots help.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
      description: Other ways to solve it, including doing nothing.
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I would like to build this myself.
