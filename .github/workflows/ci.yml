name: CI

on:
  pull_request: {}
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ['22.13', '24']
    env:
      DATABASE_URL: postgres://postgres@127.0.0.1:54329/postgres
      KRAKEN_APP_URL: http://localhost:3100
    steps:
      - name: Generate session secret
        run: echo "KRAKEN_SESSION_SECRET=$(openssl rand -base64 48)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run db:start
      - run: npm run verify

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: postgres://postgres@127.0.0.1:54329/postgres
      KRAKEN_APP_URL: http://localhost:3100
    steps:
      - name: Generate session secret
        run: echo "KRAKEN_SESSION_SECRET=$(openssl rand -base64 48)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run db:start
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
